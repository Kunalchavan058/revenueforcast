name: Starter checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
      - run: uv sync --locked --python 3.11
      - run: npm ci --ignore-scripts
      - run: uv run python scripts/configure_dvc.py
      - run: uv run dvc repro manifest@synthetic
      - run: uv run python -m retailforecast.data.file_pipeline verify --profile synthetic
      - run: uv run dvc status manifest@synthetic
      - run: uv run python -m retailforecast.features.registry --check
      - run: uv run python scripts/configure_database.py
      - run: docker compose --env-file .env -f infra/compose.yaml up -d --wait
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yaml stop
